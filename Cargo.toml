[package]
name = "wisdom-quotes"
version = "0.1.0"
edition = "2021"
authors = ["skywalker124"]
description = "A beautiful command-line tool to display random famous quotes from both English and Chinese literature"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/snakeek/wisdom-quotes"
repository = "https://github.com/snakeek/wisdom-quotes"
keywords = ["quotes", "cli", "random", "poetry", "chinese"]
categories = ["command-line-utilities"]

[[bin]]
name = "quotes"
path = "src/main.rs"

[dependencies]
rand = "0.8"
colored = "2.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
